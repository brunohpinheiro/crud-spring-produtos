<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <h1>Produtos Cadastrados</h1>
    <a th:href="@{/produtos/novo}" class="btn">Novo Produto</a>

    <form th:action="@{/produtos}" method="get" style="margin-top: 15px;">
        <input type="text" name="busca" placeholder="Buscar por nome..." style="display: inline-block;">
        <button type="submit" class="btn">Buscar</button>
        <a th:href="@{/produtos}" class="btn">Limpar</a>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${produtos}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nome}"></td>
                <td th:text="${p.preco}"></td>
                <td th:text="${p.estoque}"></td>
                <td>
                    <a th:href="@{/produtos/editar/{id}(id=${p.id})}" class="btn">Editar</a>
                    <a th:href="@{/produtos/excluir/{id}(id=${p.id})}" class="btn btn-danger"
                       onclick="return confirm('Deseja realmente excluir?')">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
